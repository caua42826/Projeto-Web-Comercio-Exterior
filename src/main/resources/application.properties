
# Nome da aplicação
spring.application.name=comercio-exterior

# Configuração do banco de dados H2
spring.datasource.url=jdbc:h2:file:./data/comercioexterior;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Importação da planilha: permanece desabilitada no uso normal do sistema.
app.importacao.planilha.executar=false
app.importacao.planilha.caminho=

# Credenciais bootstrap: defina as senhas no ambiente antes da primeira inicialização.
#usario username
app.security.bootstrap.user.username=${APP_BOOTSTRAP_USER_USERNAME}
#usuario nome
app.security.bootstrap.user.nome=${APP_BOOTSTRAP_USER_NAME}
#usuario email
app.security.bootstrap.user.email=${APP_BOOTSTRAP_USER_EMAIL}
#usuario senha
app.security.bootstrap.user.password=${APP_BOOTSTRAP_USER_PASSWORD}

#admin username
app.security.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME}
#admin nome
app.security.bootstrap.admin.nome=${APP_BOOTSTRAP_ADMIN_NAME}
#admin email
app.security.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL}
#admin senha
app.security.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD}
