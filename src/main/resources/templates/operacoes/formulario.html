<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | Comércio Exterior'"></title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container"><header class="page-header"><div><p class="eyebrow">Registro principal</p><h1 th:text="${titulo}"></h1><p class="subtitle">Os vínculos abaixo usam os cadastros já existentes.</p></div><a class="btn button button-secondary" th:href="@{/operacoes}">Voltar</a></header>
<section class="card form-panel"><form th:object="${operacao}" th:action="${operacao.id == null} ? @{/operacoes} : @{/operacoes/{id}(id=${operacao.id})}" method="post">
<h2 class="section-title">Identificação e participantes</h2><div class="row g-3 form-grid">
<div class="col-md-6 field"><label for="data">Data *</label><input class="form-control" id="data" type="date" th:field="*{data}" required><small class="field-error" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></small></div>
<div class="col-md-6 field"><label for="tipo">Tipo *</label><select class="form-select" id="tipo" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select><small class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></small></div>
<div class="col-md-6 field"><label for="status">Status *</label><select class="form-select" id="status" th:field="*{status}" required><option value="">Selecione</option><option th:each="s : ${statusList}" th:value="${s}" th:text="${#strings.replace(s.name(), '_', ' ')}"></option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
<div class="col-md-6 field"><label for="empresa">Empresa *</label><select class="form-select" id="empresa" th:field="*{empresa.id}" required><option value="">Selecione</option><option th:each="e : ${empresas}" th:value="${e.id}" th:text="${e.nome + (e.status ? '' : ' (inativa)')}"></option></select><small class="field-error" th:if="${#fields.hasErrors('empresa.id')}" th:errors="*{empresa.id}"></small></div>
<div class="col-md-6 field"><label for="parceiro">Parceiro *</label><select class="form-select" id="parceiro" th:field="*{parceiro.id}" required><option value="">Selecione</option><option th:each="p : ${parceiros}" th:value="${p.id}" th:text="${p.nome + (p.status ? '' : ' (inativo)')}"></option></select><small class="field-error" th:if="${#fields.hasErrors('parceiro.id')}" th:errors="*{parceiro.id}"></small></div>
<div class="col-md-6 field"><label for="transportadora">Transportadora *</label><select class="form-select" id="transportadora" th:field="*{transportadora.id}" required><option value="">Selecione</option><option th:each="t : ${transportadoras}" th:value="${t.id}" th:text="${t.nome + (t.status ? '' : ' (inativa)')}"></option></select><small class="field-error" th:if="${#fields.hasErrors('transportadora.id')}" th:errors="*{transportadora.id}"></small></div>
</div>
<h2 class="section-title">Carga e condições comerciais</h2><div class="row g-3 form-grid">
<div class="col-md-6 field"><label for="incoterm">Incoterm</label><input class="form-control" id="incoterm" th:field="*{incoterm}" maxlength="20"></div><div class="col-md-6 field"><label for="moeda">Moeda</label><input class="form-control" id="moeda" th:field="*{moeda}" maxlength="10"></div>
<div class="col-md-6 field"><label for="pesoBrutoKg">Peso bruto (kg)</label><input class="form-control" id="pesoBrutoKg" type="number" step="0.001" min="0" th:field="*{pesoBrutoKg}"></div><div class="col-md-6 field"><label for="quantidadeVolumes">Quantidade de volumes</label><input class="form-control" id="quantidadeVolumes" type="number" min="0" th:field="*{quantidadeVolumes}"></div>
<div class="col-md-6 field"><label for="precoTotalKG">Preço total por kg</label><input class="form-control" id="precoTotalKG" type="number" step="0.01" min="0" th:field="*{precoTotalKG}"></div><div class="col-md-6 field"><label for="valorFrete">Valor do frete</label><input class="form-control" id="valorFrete" type="number" step="0.01" min="0" th:field="*{valores.valorFrete}"></div><div class="col-md-6 field"><label for="valorSeguro">Valor do seguro</label><input class="form-control" id="valorSeguro" type="number" step="0.01" min="0" th:field="*{valores.valorSeguro}"></div>
</div>
<h2 class="section-title">Rota e prazos</h2><div class="row g-3 form-grid">
<div class="col-md-6 field"><label for="paisOrigem">País de origem</label><input class="form-control" id="paisOrigem" th:field="*{rota.paisOrigem}" maxlength="100"></div><div class="col-md-6 field"><label for="paisDestino">País de destino</label><input class="form-control" id="paisDestino" th:field="*{rota.paisDestino}" maxlength="100"></div>
<div class="col-md-6 field"><label for="idPorto">ID do porto</label><input class="form-control" id="idPorto" type="number" min="0" th:field="*{rota.idPorto}"></div><div class="col-md-6 field"><label for="modal">Modal</label><input class="form-control" id="modal" th:field="*{rota.modal}" maxlength="50"></div>
<div class="col-md-6 field"><label for="canalDesembaraco">Canal de desembaraço</label><input class="form-control" id="canalDesembaraco" th:field="*{rota.canalDesembaraco}" maxlength="100"></div><div class="col-md-6 field"><label for="portoEntradaSaida">Porto de entrada / saída</label><input class="form-control" id="portoEntradaSaida" th:field="*{rota.portoEntradaSaida}" maxlength="150"></div>
<div class="col-md-6 field"><label for="diasTransito">Dias em trânsito</label><input class="form-control" id="diasTransito" type="number" min="0" th:field="*{prazos.diasTransito}"></div><div class="col-md-6 field"><label for="diasDesembaraco">Dias para desembaraço</label><input class="form-control" id="diasDesembaraco" type="number" min="0" th:field="*{prazos.diasDesembaraco}"></div><div class="col-md-6 field"><label for="atrasoDias">Atraso (dias)</label><input class="form-control" id="atrasoDias" type="number" min="0" th:field="*{prazos.atrasoDias}"></div>
</div><div class="form-actions"><a class="btn button button-secondary" th:href="@{/operacoes}">Cancelar</a><button class="btn button button-primary" type="submit">Salvar operação</button></div></form></section></main></body></html>
