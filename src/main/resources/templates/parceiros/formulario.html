<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | Comércio Exterior'"></title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container container-narrow"><header class="page-header"><div><p class="eyebrow">Cadastros</p><h1 th:text="${titulo}"></h1><p class="subtitle">Informe os dados do parceiro.</p></div><a class="btn button button-secondary" th:href="@{/parceiros}">Voltar</a></header>
<section class="card form-panel"><form th:object="${parceiro}" th:action="${parceiro.id == null} ? @{/parceiros} : @{/parceiros/{id}(id=${parceiro.id})}" method="post"><div class="row g-3 form-grid">
<div class="col-12 field field-full"><label for="nome">Nome *</label><input class="form-control" id="nome" th:field="*{nome}" maxlength="150" required><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></div>
<div class="col-md-6 field"><label for="pais">País</label><input class="form-control" id="pais" th:field="*{pais}" maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></small></div>
<div class="col-md-6 field"><label for="continente">Continente</label><input class="form-control" id="continente" th:field="*{continente}" maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('continente')}" th:errors="*{continente}"></small></div>
<div class="col-md-6 field"><label for="tipo">Tipo</label><input class="form-control" id="tipo" th:field="*{tipo}" maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></small></div>
<div class="col-md-6 field"><label for="setor">Setor</label><input class="form-control" id="setor" th:field="*{setor}" maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}"></small></div>
<div class="col-md-6 field"><label for="avaliacaoConfiabilidade">Avaliação de confiabilidade</label><input class="form-control" id="avaliacaoConfiabilidade" type="number" step="0.1" th:field="*{avaliacaoConfiabilidade}"></div>
<div class="col-md-6 field"><label for="status">Status *</label><select class="form-select" id="status" th:field="*{status}" required><option value="">Selecione</option><option value="true">Ativo</option><option value="false">Inativo</option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
</div><div class="form-actions"><a class="btn button button-secondary" th:href="@{/parceiros}">Cancelar</a><button class="btn button button-primary" type="submit">Salvar parceiro</button></div></form></section></main></body></html>
