<header class="site-header" xmlns:th="http://www.thymeleaf.org" th:fragment="barra">
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}" aria-label="HORIZONTEZS - início">
            <img class="brand-mark" th:src="@{/images/logo-comercio-exterior.png}" alt="Logo HORIZONTEZS">
            <span>
                <span class="brand-name">HORIZONTEZS</span>
                <span class="brand-caption">O mundo gira. Nós movimentamos</span>
            </span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal" th:if="${usuarioAutenticado != null}">
            <a th:href="@{/}">Início</a>
            <a th:href="@{/operacoes}">Operações</a>
            <a th:href="@{/empresas}">Empresas</a>
            <a th:href="@{/parceiros}">Parceiros</a>
            <a th:href="@{/produtos}">Produtos</a>
            <a th:href="@{/transportadoras}">Transportadoras</a>
            <a th:href="@{/taxas-cambio}">Câmbio</a>
            <a th:href="@{/indicadores}">Indicadores</a>
        </nav>
        <div class="site-user-actions" th:if="${usuarioAutenticado != null}">
            <a class="user-action" th:if="${isAdmin}" th:href="@{/admin}">Administração</a>
            <a class="user-action" th:href="@{/conta/senha}">Minha senha</a>
            <span class="site-user-name" th:text="${usuarioAutenticado}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn button button-small button-secondary" type="submit">Sair</button>
            </form>
        </div>
    </div>
</header>
