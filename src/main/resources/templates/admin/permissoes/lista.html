<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permissões | Administração</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="container">
    <header class="page-header"><div><p class="eyebrow">Administração</p><h1>Permissões</h1><p class="subtitle">Permissões representam ações que os perfis podem executar.</p></div><a class="btn button button-primary" th:href="@{/admin/permissoes/nova}">Nova permissão</a></header>
    <div class="notice notice-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div><div class="notice notice-error" role="alert" th:if="${erro}" th:text="${erro}"></div>
    <section class="panel"><div class="table-scroll" th:if="${!permissoes.isEmpty()}"><table class="table align-middle"><thead><tr><th>Código</th><th>Nome</th><th>Descrição</th><th>Status</th><th>Ações</th></tr></thead><tbody>
        <tr th:each="permissao : ${permissoes}"><td class="strong" th:text="${permissao.codigo}"></td><td th:text="${permissao.nome}"></td><td th:text="${permissao.descricao}"></td><td><span class="badge" th:classappend="${permissao.ativo} ? ' badge-active' : ' badge-inactive'" th:text="${permissao.ativo} ? 'Ativa' : 'Inativa'"></span><span class="badge badge-system" th:if="${permissao.deSistema}">Sistema</span></td><td class="admin-row-actions"><a class="btn button button-small button-secondary" th:href="@{/admin/permissoes/{id}/editar(id=${permissao.id})}">Editar</a><form th:if="${!permissao.deSistema}" th:action="@{/admin/permissoes/{id}/excluir(id=${permissao.id})}" method="post"><button class="btn button button-small button-danger" type="submit">Excluir</button></form></td></tr>
    </tbody></table></div><div class="empty-state" th:if="${permissoes.isEmpty()}"><h2>Nenhuma permissão cadastrada</h2></div></section>
    <a class="back-link" th:href="@{/admin}">Voltar ao painel administrativo</a>
</main>
</body>
</html>
