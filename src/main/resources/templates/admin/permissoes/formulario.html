<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permissão | Administração</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="container container-narrow">
    <header class="page-header"><div><p class="eyebrow">Administração</p><h1 th:text="${permissaoId != null ? 'Editar permissão' : 'Nova permissão'}">Nova permissão</h1><p class="subtitle">O código identifica a permissão no backend e não pode ser alterado depois da criação.</p></div><a class="btn button button-secondary" th:href="@{/admin/permissoes}">Voltar</a></header>
    <section class="card form-panel"><form th:object="${permissao}" th:action="${permissaoId != null} ? @{/admin/permissoes/{id}(id=${permissaoId})} : @{/admin/permissoes}" method="post">
        <div class="row g-3 form-grid">
            <div class="col-md-6 field"><label for="codigo">Código</label><input class="form-control" id="codigo" type="text" th:field="*{codigo}" maxlength="80" th:readonly="${permissaoId != null}" required><small class="field-error" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></small></div>
            <div class="col-md-6 field"><label for="nome">Nome</label><input class="form-control" id="nome" type="text" th:field="*{nome}" maxlength="120" required><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></div>
            <div class="col-12 field"><label for="descricao">Descrição</label><input class="form-control" id="descricao" type="text" th:field="*{descricao}" maxlength="250"></div>
            <div class="col-12 field"><label class="check-option"><input class="form-check-input" type="checkbox" th:field="*{ativo}"><span><strong>Permissão ativa</strong><small>Permissões inativas não são concedidas na autenticação.</small></span></label></div>
        </div>
        <div class="form-actions"><a class="btn button button-secondary" th:href="@{/admin/permissoes}">Cancelar</a><button class="btn button button-primary" type="submit">Salvar permissão</button></div>
    </form></section>
</main>
</body>
</html>
