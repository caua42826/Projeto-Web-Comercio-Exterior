<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Perfis | Administração</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="container">
    <header class="page-header"><div><p class="eyebrow">Administração</p><h1>Perfis de acesso</h1><p class="subtitle">Perfis agrupam permissões e podem ser associados a vários usuários.</p></div><a class="btn button button-primary" th:href="@{/admin/perfis/novo}">Novo perfil</a></header>
    <div class="notice notice-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div><div class="notice notice-error" role="alert" th:if="${erro}" th:text="${erro}"></div>
    <section class="panel"><div class="table-scroll" th:if="${!perfis.isEmpty()}"><table class="table align-middle"><thead><tr><th>Código</th><th>Nome</th><th>Permissões</th><th>Status</th><th>Ações</th></tr></thead><tbody>
        <tr th:each="perfil : ${perfis}"><td class="strong" th:text="${perfil.codigo}"></td><td><strong th:text="${perfil.nome}"></strong><small class="d-block" th:text="${perfil.descricao}"></small></td><td th:text="${#strings.listJoin(perfil.permissoes, ', ')}"></td><td><span class="badge" th:classappend="${perfil.ativo} ? ' badge-active' : ' badge-inactive'" th:text="${perfil.ativo} ? 'Ativo' : 'Inativo'"></span></td><td class="admin-row-actions"><a class="btn button button-small button-secondary" th:href="@{/admin/perfis/{id}/editar(id=${perfil.id})}">Editar</a><form th:if="${perfil.codigo != 'ADMIN' and perfil.codigo != 'USER'}" th:action="@{/admin/perfis/{id}/excluir(id=${perfil.id})}" method="post"><button class="btn button button-small button-danger" type="submit">Excluir</button></form></td></tr>
    </tbody></table></div><div class="empty-state" th:if="${perfis.isEmpty()}"><h2>Nenhum perfil cadastrado</h2></div></section>
    <a class="back-link" th:href="@{/admin}">Voltar ao painel administrativo</a>
</main>
</body>
</html>
