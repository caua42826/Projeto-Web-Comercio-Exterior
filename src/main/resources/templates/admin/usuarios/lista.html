<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuários | Administração</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="container">
    <header class="page-header"><div><p class="eyebrow">Administração</p><h1>Usuários</h1><p class="subtitle">Gerencie contas, perfis de acesso e redefinições de senha.</p></div><a class="btn button button-primary" th:href="@{/admin/usuarios/novo}">Novo usuário</a></header>
    <div class="notice notice-success" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="notice notice-error" role="alert" th:if="${erro}" th:text="${erro}"></div>
    <section class="panel">
        <div class="table-scroll" th:if="${!usuarios.isEmpty()}">
            <table class="table align-middle"><thead><tr><th>Nome</th><th>Usuário / e-mail</th><th>Perfis</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody><tr th:each="u : ${usuarios}">
                    <td class="strong" th:text="${u.nomeCompleto}"></td>
                    <td><strong th:text="${u.username}"></strong><br><small th:text="${u.email}"></small></td>
                    <td th:text="${#strings.listJoin(u.perfis, ', ')}"></td>
                    <td><span class="badge" th:classappend="${u.ativo} ? ' badge-active' : ' badge-inactive'" th:text="${u.ativo} ? 'Ativo' : 'Inativo'"></span><small class="d-block mt-1" th:if="${u.deveAlterarSenha}">Troca de senha pendente</small></td>
                    <td class="admin-row-actions">
                        <a class="btn button button-small button-secondary" th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">Editar</a>
                        <form th:action="@{/admin/usuarios/{id}/status(id=${u.id})}" method="post"><input type="hidden" name="ativo" th:value="${!u.ativo}"><button class="btn button button-small" th:classappend="${u.ativo} ? ' button-danger' : ' button-primary'" type="submit" th:text="${u.ativo} ? 'Desativar' : 'Ativar'"></button></form>
                        <details class="reset-password"><summary class="btn button button-small button-secondary">Redefinir senha</summary>
                            <form class="reset-password-panel" th:action="@{/admin/usuarios/{id}/senha(id=${u.id})}" method="post">
                                <label>Nova senha temporária<input class="form-control" type="password" name="senha" minlength="10" maxlength="72" autocomplete="new-password" required></label>
                                <label>Confirmar senha<input class="form-control" type="password" name="confirmarSenha" minlength="10" maxlength="72" autocomplete="new-password" required></label>
                                <button class="btn button button-primary button-small" type="submit">Salvar senha</button>
                            </form>
                        </details>
                    </td>
                </tr></tbody>
            </table>
        </div>
        <div class="empty-state" th:if="${usuarios.isEmpty()}"><h2>Nenhum usuário cadastrado</h2><a class="btn button button-primary" th:href="@{/admin/usuarios/novo}">Criar primeiro usuário</a></div>
    </section>
    <a class="back-link" th:href="@{/admin}">Voltar ao painel administrativo</a>
</main>
<script th:src="@{/js/password-visibility.js}" defer></script>
</body>
</html>
