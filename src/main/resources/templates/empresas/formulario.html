<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Comércio Exterior'">Empresa | Comércio Exterior</title>
    <th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="container container-narrow">
    <header class="page-header">
        <div>
            <p class="eyebrow">Comércio exterior</p>
            <h1 th:text="${titulo}">Empresa</h1>
            <p class="subtitle">Os campos marcados com * são obrigatórios.</p>
        </div>
        <a class="btn button button-secondary" th:href="@{/empresas}">Voltar</a>
    </header>

    <section class="card form-panel">
        <form th:object="${empresa}"
              th:action="${empresa.id == null} ? @{/empresas} : @{/empresas/{id}(id=${empresa.id})}"
              method="post">
            <div class="row g-3 form-grid">
                <div class="col-12 field field-full">
                    <label for="nome">Nome da empresa *</label>
                    <input class="form-control" id="nome" type="text" th:field="*{nome}" maxlength="150" required autofocus
                    ><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                </div>

                <div class="col-md-6 field">
                    <label for="setor">Setor</label>
                    <input class="form-control" id="setor" type="text" th:field="*{setor}" maxlength="100"
                    ><small class="field-error" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}"></small>
                </div>
                <div class="col-md-6 field">
                    <label for="tipoAtuacao">Tipo de atuação</label>
                    <input class="form-control" id="tipoAtuacao" type="text" th:field="*{tipoAtuacao}" maxlength="100"
                    ><small class="field-error" th:if="${#fields.hasErrors('tipoAtuacao')}" th:errors="*{tipoAtuacao}"></small>
                </div>
                <div class="col-md-6 field">
                    <label for="cidade">Cidade</label>
                    <input class="form-control" id="cidade" type="text" th:field="*{cidade}" maxlength="100"
                    ><small class="field-error" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></small>
                </div>
                <div class="col-md-6 field">
                    <label for="estado">Estado</label>
                    <input class="form-control" id="estado" type="text" th:field="*{estado}" maxlength="100"
                    ><small class="field-error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></small>
                </div>
                <div class="col-md-6 field">
                    <label for="porte">Porte</label>
                    <input class="form-control" id="porte" type="text" th:field="*{porte}" maxlength="50"
                    ><small class="field-error" th:if="${#fields.hasErrors('porte')}" th:errors="*{porte}"></small>
                </div>
                <div class="col-md-6 field">
                    <label for="status">Status *</label>
                    <select class="form-select" id="status" th:field="*{status}" required
                        ><option value="">Selecione</option>
                        <option value="true">Ativa</option>
                        <option value="false">Inativa</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>
                </div>
            </div>

            <div class="form-actions">
                <a class="btn button button-secondary" th:href="@{/empresas}">Cancelar</a>
                <button class="btn button button-primary" type="submit">Salvar empresa</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
