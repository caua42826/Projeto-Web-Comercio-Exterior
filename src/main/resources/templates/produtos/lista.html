<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | Comércio Exterior</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container"><header class="page-header"><div><p class="eyebrow">Cadastros</p><h1>Produtos</h1><p class="subtitle">Catálogo de produtos usados nos itens das operações.</p></div><a th:if="${podeGerenciarDados}" class="btn button button-primary" th:href="@{/produtos/novo}">Novo produto</a></header>
<div class="notice notice-success" th:if="${mensagem}" th:text="${mensagem}"></div><div class="notice notice-error" th:if="${erro}" th:text="${erro}"></div>
<section class="panel"><div class="table-scroll" th:if="${!produtos.isEmpty()}"><table class="table align-middle"><thead><tr><th>Descrição</th><th>Categoria</th><th>NCM</th><th>Unidade</th><th>Licença</th><th>Status</th><th class="actions-heading">Ações</th></tr></thead><tbody>
<tr th:each="p : ${produtos}"><td class="strong" th:text="${p.descricao}"></td><td th:text="${p.categoria ?: '—'}"></td><td th:text="${p.ncmSintetico ?: '—'}"></td><td th:text="${p.unidadeMedida ?: '—'}"></td><td th:text="${p.necessitaLicenca} ? 'Sim' : 'Não'"></td><td><span class="badge" th:classappend="${p.status} ? ' badge-active' : ' badge-inactive'" th:text="${p.status} ? 'Ativo' : 'Inativo'"></span></td><td class="actions"><a th:if="${podeGerenciarDados}" class="btn button button-small button-secondary" th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a><form th:if="${p.status and podeGerenciarDados}" th:action="@{/produtos/{id}/desativar(id=${p.id})}" method="post"><button class="btn button button-small button-danger" type="submit">Desativar</button></form></td></tr>
</tbody></table></div><div class="empty-state" th:if="${produtos.isEmpty()}"><h2>Nenhum produto cadastrado</h2><a th:if="${podeGerenciarDados}" class="btn button button-primary" th:href="@{/produtos/novo}">Cadastrar produto</a></div></section></main></body></html>
