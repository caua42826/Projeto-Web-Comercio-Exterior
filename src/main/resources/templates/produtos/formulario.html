<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | Comércio Exterior'"></title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container container-narrow"><header class="page-header"><div><p class="eyebrow">Cadastros</p><h1 th:text="${titulo}"></h1><p class="subtitle">Informe as características do produto.</p></div><a class="btn button button-secondary" th:href="@{/produtos}">Voltar</a></header>
<section class="card form-panel"><form th:object="${produto}" th:action="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}" method="post"><div class="row g-3 form-grid">
<div class="col-12 field field-full"><label for="descricao">Descrição *</label><input class="form-control" id="descricao" th:field="*{descricao}" maxlength="255" required><small class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></small></div>
<div class="col-md-6 field"><label for="categoria">Categoria</label><input class="form-control" id="categoria" th:field="*{categoria}" maxlength="100"></div><div class="col-md-6 field"><label for="ncmSintetico">NCM sintético</label><input class="form-control" id="ncmSintetico" th:field="*{ncmSintetico}" maxlength="20"></div>
<div class="col-md-6 field"><label for="unidadeMedida">Unidade de medida</label><input class="form-control" id="unidadeMedida" th:field="*{unidadeMedida}" maxlength="20"></div><div class="col-md-6 field"><label for="pesoUnitKg">Peso unitário (kg)</label><input class="form-control" id="pesoUnitKg" type="number" step="0.001" min="0" th:field="*{pesoUnitKg}"></div>
<div class="col-md-6 field"><label for="valorUnRefUSD">Valor de referência (USD)</label><input class="form-control" id="valorUnRefUSD" type="number" step="0.01" min="0" th:field="*{valorUnRefUSD}"></div>
<div class="col-md-6 field"><label for="necessitaLicenca">Necessita licença *</label><select class="form-select" id="necessitaLicenca" th:field="*{necessitaLicenca}" required><option value="">Selecione</option><option value="true">Sim</option><option value="false">Não</option></select></div>
<div class="col-md-6 field"><label for="status">Status *</label><select class="form-select" id="status" th:field="*{status}" required><option value="">Selecione</option><option value="true">Ativo</option><option value="false">Inativo</option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
</div><div class="form-actions"><a class="btn button button-secondary" th:href="@{/produtos}">Cancelar</a><button class="btn button button-primary" type="submit">Salvar produto</button></div></form></section></main></body></html>
