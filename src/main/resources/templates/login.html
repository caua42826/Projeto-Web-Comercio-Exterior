<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Comércio Exterior</title>
    <th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div>
<main class="auth-shell">
    <section class="card auth-card">
        <p class="eyebrow">Acesso seguro</p>
        <h1>Entrar no sistema</h1>
        <p class="subtitle">Use seu nome de usuário e senha para continuar.</p>

        <div class="notice notice-error" role="alert" th:if="${param.erro}">Usuário ou senha inválidos.</div>
        <div class="notice notice-error" role="alert" th:if="${param.bloqueado}">Esta conta está inativa. Procure um administrador.</div>
        <div class="notice notice-error" role="alert" th:if="${param.expirada}">Sua sessão expirou. Entre novamente.</div>
        <div class="notice notice-success" role="status" th:if="${param.logout}">Você saiu do sistema com segurança.</div>
        <div class="notice notice-success" role="status" th:if="${param.senhaAtualizada}">Senha atualizada. Entre novamente com a nova senha.</div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="field">
                <label for="username">Usuário</label>
                <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn button button-primary w-100" type="submit">Entrar</button>
        </form>
    </section>
</main>
<script th:src="@{/js/password-visibility.js}" defer></script>
</body>
</html>
