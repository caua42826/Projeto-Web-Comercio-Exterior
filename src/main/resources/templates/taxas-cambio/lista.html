<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxas de câmbio | Comércio Exterior</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container"><header class="page-header"><div><p class="eyebrow">Cadastros de referência</p><h1>Taxas de câmbio</h1><p class="subtitle">Taxas médias por moeda e mês de referência.</p></div><a th:if="${podeGerenciarDados}" class="btn button button-primary" th:href="@{/taxas-cambio/nova}">Nova taxa</a></header>
<div class="notice notice-success" th:if="${mensagem}" th:text="${mensagem}"></div><div class="notice notice-error" th:if="${erro}" th:text="${erro}"></div>
<section class="panel"><div class="table-scroll" th:if="${!taxas.isEmpty()}"><table class="table align-middle"><thead><tr><th>Mês de referência</th><th>Moeda</th><th>Taxa média (BRL)</th><th class="actions-heading">Ações</th></tr></thead><tbody>
<tr th:each="t : ${taxas}"><td th:text="${t.mesAno != null ? #temporals.format(t.mesAno, 'MM/yyyy') : '—'}"></td><td class="strong" th:text="${t.moeda}"></td><td th:text="${t.taxaMediaBRL}"></td><td class="actions"><a th:if="${podeGerenciarDados}" class="btn button button-small button-secondary" th:href="@{/taxas-cambio/{id}/editar(id=${t.id})}">Editar</a></td></tr>
</tbody></table></div><div class="empty-state" th:if="${taxas.isEmpty()}"><h2>Nenhuma taxa cadastrada</h2><a th:if="${podeGerenciarDados}" class="btn button button-primary" th:href="@{/taxas-cambio/nova}">Cadastrar taxa</a></div></section></main></body></html>
