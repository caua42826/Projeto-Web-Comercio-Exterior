<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | Comércio Exterior'"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container container-narrow"><header class="page-header"><div><p class="eyebrow">Cadastros de referência</p><h1 th:text="${titulo}"></h1><p class="subtitle">Registre a taxa média da moeda para um mês.</p></div><a class="button button-secondary" th:href="@{/taxas-cambio}">Voltar</a></header>
<section class="panel form-panel"><form th:object="${taxaCambio}" th:action="${taxaCambio.id == null} ? @{/taxas-cambio} : @{/taxas-cambio/{id}(id=${taxaCambio.id})}" method="post"><div class="form-grid">
<div class="field"><label for="moeda">Moeda *</label><input id="moeda" th:field="*{moeda}" maxlength="10" placeholder="USD" required><small class="field-error" th:if="${#fields.hasErrors('moeda')}" th:errors="*{moeda}"></small></div>
<div class="field"><label for="mesAno">Mês de referência *</label><input id="mesAno" type="date" th:field="*{mesAno}" required><small class="field-error" th:if="${#fields.hasErrors('mesAno')}" th:errors="*{mesAno}"></small></div>
<div class="field"><label for="taxaMediaBRL">Taxa média para BRL *</label><input id="taxaMediaBRL" type="number" min="0.000001" step="0.000001" th:field="*{taxaMediaBRL}" required><small class="field-error" th:if="${#fields.hasErrors('taxaMediaBRL')}" th:errors="*{taxaMediaBRL}"></small></div>
</div><div class="form-actions"><a class="button button-secondary" th:href="@{/taxas-cambio}">Cancelar</a><button class="button button-primary" type="submit">Salvar taxa</button></div></form></section></main></body></html>
