<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transportadoras | Comércio Exterior</title><th:block th:replace="~{fragments/bootstrap :: estilos}"></th:block></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container"><header class="page-header"><div><p class="eyebrow">Cadastros</p><h1>Transportadoras</h1><p class="subtitle">Empresas de transporte vinculadas às operações.</p></div><a class="btn button button-primary" th:href="@{/transportadoras/nova}">Nova transportadora</a></header>
<div class="notice notice-success" th:if="${mensagem}" th:text="${mensagem}"></div><div class="notice notice-error" th:if="${erro}" th:text="${erro}"></div>
<section class="panel"><div class="table-scroll" th:if="${!transportadoras.isEmpty()}"><table class="table align-middle"><thead><tr><th>Nome</th><th>Modal</th><th>País sede</th><th>Prazo médio</th><th>Avaliação</th><th>Status</th><th class="actions-heading">Ações</th></tr></thead><tbody>
<tr th:each="t : ${transportadoras}"><td class="strong" th:text="${t.nome}"></td><td th:text="${t.modalPrincipal ?: '—'}"></td><td th:text="${t.paisSede ?: '—'}"></td><td th:text="${t.prazoMedioDias != null ? t.prazoMedioDias + ' dias' : '—'}"></td><td th:text="${t.avaliacaoServico != null ? t.avaliacaoServico : '—'}"></td><td><span class="badge" th:classappend="${t.status} ? ' badge-active' : ' badge-inactive'" th:text="${t.status} ? 'Ativa' : 'Inativa'"></span></td><td class="actions"><a class="btn button button-small button-secondary" th:href="@{/transportadoras/{id}/editar(id=${t.id})}">Editar</a><form th:if="${t.status}" th:action="@{/transportadoras/{id}/desativar(id=${t.id})}" method="post"><button class="btn button button-small button-danger" type="submit">Desativar</button></form></td></tr>
</tbody></table></div><div class="empty-state" th:if="${transportadoras.isEmpty()}"><h2>Nenhuma transportadora cadastrada</h2><a class="btn button button-primary" th:href="@{/transportadoras/nova}">Cadastrar transportadora</a></div></section></main></body></html>
