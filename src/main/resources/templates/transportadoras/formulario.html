<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | Comércio Exterior'"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/navegacao :: barra}"></div><main class="container container-narrow"><header class="page-header"><div><p class="eyebrow">Cadastros</p><h1 th:text="${titulo}"></h1><p class="subtitle">Informe os dados da transportadora.</p></div><a class="button button-secondary" th:href="@{/transportadoras}">Voltar</a></header>
<section class="panel form-panel"><form th:object="${transportadora}" th:action="${transportadora.id == null} ? @{/transportadoras} : @{/transportadoras/{id}(id=${transportadora.id})}" method="post"><div class="form-grid">
<div class="field field-full"><label for="nome">Nome *</label><input id="nome" th:field="*{nome}" maxlength="150" required><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></div>
<div class="field"><label for="modalPrincipal">Modal principal</label><input id="modalPrincipal" th:field="*{modalPrincipal}" maxlength="50"></div><div class="field"><label for="paisSede">País sede</label><input id="paisSede" th:field="*{paisSede}" maxlength="100"></div>
<div class="field"><label for="prazoMedioDias">Prazo médio (dias)</label><input id="prazoMedioDias" type="number" min="0" th:field="*{prazoMedioDias}"></div><div class="field"><label for="avaliacaoServico">Avaliação do serviço</label><input id="avaliacaoServico" type="number" step="0.1" th:field="*{avaliacaoServico}"></div>
<div class="field"><label for="status">Status *</label><select id="status" th:field="*{status}" required><option value="">Selecione</option><option value="true">Ativa</option><option value="false">Inativa</option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
</div><div class="form-actions"><a class="button button-secondary" th:href="@{/transportadoras}">Cancelar</a><button class="button button-primary" type="submit">Salvar transportadora</button></div></form></section></main></body></html>
